<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="100%" height="100%">
  <defs>
    <!-- Matte Editorial Palette (Non-Neon) -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>

    <!-- Subtle Section Headers -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');

      text {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Calm, professional flow paths */
      .flow-path {
        stroke-dasharray: 6 10;
        animation: flowAnimation 3.2s linear infinite;
      }
      .flow-path-fast {
        stroke-dasharray: 5 8;
        animation: flowAnimation 2.2s linear infinite;
      }

      @keyframes flowAnimation {
        from { stroke-dashoffset: 32; }
        to { stroke-dashoffset: 0; }
      }

      /* Subtle attention weight link oscillation */
      .attn-link {
        animation: attnFluctuate 2.8s ease-in-out infinite alternate;
      }
      @keyframes attnFluctuate {
        0% { stroke-opacity: 0.3; stroke-width: 1; }
        100% { stroke-opacity: 0.8; stroke-width: 1.8; }
      }

      /* Calm missing indicator pulse */
      .missing-soft-pulse {
        animation: missingSoft 3s ease-in-out infinite;
      }
      @keyframes missingSoft {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Main Background Container -->
  <rect width="1060" height="560" rx="14" fill="url(#canvasBg)" stroke="#334155" stroke-width="1.2"/>

  <!-- Minimal Coordinate Grid Overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="0.8">
    <line x1="0" y1="70" x2="1060" y2="70"/>
    <line x1="0" y1="480" x2="1060" y2="480"/>
    <line x1="205" y1="70" x2="205" y2="480"/>
    <line x1="390" y1="70" x2="390" y2="480"/>
    <line x1="600" y1="70" x2="600" y2="480"/>
    <line x1="800" y1="70" x2="800" y2="480"/>
  </g>

  <!-- Header Title Bar -->
  <g transform="translate(35, 36)">
    <circle cx="6" cy="6" r="4.5" fill="#2563eb"/>
    <text x="20" y="10" fill="#f8fafc" font-size="14.5" font-weight="700" letter-spacing="0.3">ONIC • MULTIMODAL CROSS-ATTENTION NEURAL ARCHITECTURE</text>
    
    <rect x="710" y="-5" width="280" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="722" y="11" fill="#94a3b8" font-size="11" font-weight="600" class="mono">STATUS: 99.56% MACRO-F1 | 15 CONDITIONS</text>
  </g>

  <!-- ==================== COLUMN 1: PATIENT MULTI-OMICS ==================== -->
  <g transform="translate(35, 78)">
    <text x="0" y="0" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.8">1. PATIENT OMICS</text>

    <!-- 1. mRNA -->
    <g transform="translate(0, 18)">
      <rect width="150" height="74" rx="8" fill="#111c33" stroke="#2563eb" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="74" rx="1" fill="#3b82f6"/>
      <text x="14" y="24" fill="#e2e8f0" font-size="12.5" font-weight="700">mRNA Expression</text>
      <text x="14" y="41" fill="#94a3b8" font-size="10.5">Transcriptomic</text>
      <rect x="14" y="49" width="105" height="18" rx="3" fill="#1e293b"/>
      <text x="20" y="62" fill="#93c5fd" font-size="10" font-weight="600" class="mono">3,217 features</text>
