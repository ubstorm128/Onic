      <rect width="150" height="74" rx="8" fill="#241a0d" stroke="#b45309" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="74" rx="1" fill="#f59e0b"/>
      <text x="14" y="24" fill="#e2e8f0" font-size="12.5" font-weight="700">DNA Methylation</text>
      <text x="14" y="41" fill="#94a3b8" font-size="10.5">Epigenetic Silencing</text>
      <rect x="14" y="49" width="105" height="18" rx="3" fill="#1e293b"/>
      <text x="20" y="62" fill="#fcd34d" font-size="10" font-weight="600" class="mono">3,139 features</text>
    </g>
  </g>

