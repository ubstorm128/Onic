      <text x="14" y="24" fill="#e2e8f0" font-size="12.5" font-weight="700">miRNA Regulation</text>
      <text x="14" y="41" fill="#94a3b8" font-size="10.5">Post-Transcriptional</text>
      <rect x="14" y="49" width="95" height="18" rx="3" fill="#1e293b"/>
      <text x="20" y="62" fill="#a5b4fc" font-size="10" font-weight="600" class="mono">383 features</text>
