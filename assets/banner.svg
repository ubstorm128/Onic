<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="40%" stop-color="#0b132b"/>
      <stop offset="80%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <radialGradient id="bannerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .brand-title {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -1px;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .mono-pill {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Animated Wave Signals */
      .signal-wave {
        stroke-dasharray: 6 14;
        animation: waveFlow 3s linear infinite;
      }
      @keyframes waveFlow {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }

      /* Breathing Glow */
      .glow-pulse {
        animation: glowBreath 4s ease-in-out infinite alternate;
      }
      @keyframes glowBreath {
        0% { opacity: 0.6; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1200" height="320" rx="16" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1200" height="320" rx="16" fill="url(#bannerGlow)"/>

  <!-- Subtle Cyber Wireframe Background -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <path d="M 0 60 Q 300 120 600 60 T 1200 60" fill="none"/>
    <path d="M 0 160 Q 300 220 600 160 T 1200 160" fill="none"/>
    <path d="M 0 260 Q 300 200 600 260 T 1200 260" fill="none"/>
  </g>

  <!-- Animated Data Ribbons Connecting Across -->
  <g fill="none" stroke-width="2" opacity="0.45">
    <path d="M 50 160 C 250 80, 450 240, 650 160 S 1050 80, 1150 160" stroke="#38bdf8" class="signal-wave"/>
    <path d="M 50 170 C 250 250, 450 90, 650 170 S 1050 250, 1150 170" stroke="#c084fc" class="signal-wave" style="animation-duration: 4.5s;"/>
  </g>

  <!-- Center Hero Branding -->
  <g transform="translate(600, 110)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="-185" y="-55" width="370" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <circle cx="-165" cy="-40" r="4.5" fill="#10b981" filter="url(#neonGlow)"/>
    <text x="10" y="-35" fill="#94a3b8" font-size="12" font-weight="600" class="mono-pill">TCGA PAN-CANCER MULTI-OMICS AI</text>

    <!-- Main Title -->
    <text x="0" y="25" fill="url(#titleGrad)" font-size="54" class="brand-title" filter="url(#neonGlow)">ONIC FRAMEWORK</text>

    <!-- Subtitle -->
    <text x="0" y="65" fill="#f1f5f9" font-size="18" class="brand-sub">
      Robust Multi-Cancer Classification Under Missing Modalities
    </text>

    <text x="0" y="92" fill="#94a3b8" font-size="13" class="brand-sub">
      Cross-Modal Attention • Modality Dropout • Learned Default Imputation • 4 Pan-Cancer Subtypes
    </text>
  </g>

  <!-- Bottom Metric Pills -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <!-- Pill 1 -->
    <g transform="translate(-310, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="8" fill="#0c1929" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="0" y="5" fill="#38bdf8" font-size="13" font-weight="700" class="mono-pill">99.56% MACRO-F1</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-100, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="8" fill="#190d2e" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="0" y="5" fill="#c084fc" font-size="13" font-weight="700" class="mono-pill">0.9996 MACRO-AUC</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(110, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="8" fill="#04271c" stroke="#10b981" stroke-width="1.2"/>
      <text x="0" y="5" fill="#34d399" font-size="13" font-weight="700" class="mono-pill">15 MISSING STATES</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(320, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="8" fill="#1f111e" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="0" y="5" fill="#fb7185" font-size="13" font-weight="700" class="mono-pill">+8.52% STRESS GAIN</text>
    </g>
  </g>
</svg>
